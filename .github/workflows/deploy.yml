name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/whatsapp-social-bridge
            git reset --hard HEAD
            git pull origin main
            npm install
            npx dotenv -e .env -- prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss
            npx dotenv -e .env -- prisma generate --schema=apps/api/prisma/schema.prisma
            npm run build
            pm2 restart all
