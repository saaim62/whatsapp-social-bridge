name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  # Gate: deployment is impossible unless the API builds, the FULL
  # API test suite passes, and the web app builds. (P1-7 — previously
  # this workflow deployed with no test gate at all and applied schema
  # changes with `prisma db push --accept-data-loss`.)
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/whatsapp_bridge?schema=public

      - name: Build API
        run: npm run build -w api

      - name: Test API (full suite must be green)
        run: npm run test -w api

      - name: Build Web
        run: npm run build -w web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  build_and_deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Create Dummy .env for Prisma Generate & Next.js Build
        run: echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/whatsapp_bridge?schema=public" > .env

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build API
        run: npm run build -w apps/api

      - name: Build Web
        run: npm run build -w apps/web

      - name: Compress Build Artifacts
        run: tar -czf build.tar.gz apps/web/.next apps/api/dist

      - name: Transfer Build Artifacts to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: saaim62
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build.tar.gz"
          target: "~/whatsapp-social-bridge"

      - name: Restart Server Services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: saaim62
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/whatsapp-social-bridge
            git reset --hard HEAD
            git pull origin main
            tar -xzf build.tar.gz
            rm build.tar.gz
            export NODE_OPTIONS="--max-old-space-size=1536"
            npm install --omit=dev --no-audit --prefer-offline
            export $(cat .env | grep -v ^# | xargs)
            # Apply committed migrations only. NEVER `prisma db push
            # --accept-data-loss` here: it can silently drop columns/
            # tables that are missing from the schema. Schema changes
            # ship as reviewed migrations under apps/api/prisma/migrations.
            npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
            npx prisma generate --schema=apps/api/prisma/schema.prisma
            pm2 restart all --update-env || (pm2 start apps/api/dist/src/main.js --name "whatsapp-api" && pm2 start "npm run start" --name "whatsapp-web" --cwd apps/web)
            pm2 save
